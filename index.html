<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A1E1A">
<title>おひとりONU</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Dela+Gothic+One&family=Roboto+Mono:wght@400;500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap">
<style>
/* ═══ 夜の卓 ── 単一のビジュアルワールドとして全色を明示的に塗る ═══ */
:root{
  --felt-1:#1B6B53; --felt-2:#0E4436; --felt-3:#06231C;
  --rail-1:#2E2116; --rail-2:#170F09;
  --brass:#D9B45F; --brass-dim:#8A7237; --brass-hot:#F5DA9A;
  --ivory:#F1EDE2; --ivory-2:#B9C4BC; --ivory-3:#7C8D85;
  --seal:#D8382F;
  --panel:#10211C; --panel-2:#16302A; --edge:#2C4E44;
  --r:#D2333D; --y:#E7B01D; --g:#2FA05C; --b:#2A6FDA; --w:#14151A;
  --cardw:84px;
  --lift:0 18px 34px -18px rgba(0,0,0,.9), 0 2px 4px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{height:100%}
@supports (height:100dvh){html,body{height:100dvh}}
body{
  margin:0; color:var(--ivory);
  background:radial-gradient(1200px 700px at 50% -10%, #1A3A33 0%, #0A1E1A 55%, #060F0D 100%), #060F0D;
  font-family:"Zen Kaku Gothic New",-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  font-size:14px; line-height:1.7; -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--brass-hot);outline-offset:3px}
.room{max-width:1120px;margin:0 auto;padding:12px 14px 16px;
  display:flex;flex-direction:column;gap:10px;height:100%}

/* ── ヘッダー ── */
.bar{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
.logo{font-family:"Dela Gothic One",sans-serif;font-weight:400;margin:0;line-height:1;
  font-size:clamp(19px,4.4vw,28px);color:var(--ivory);text-shadow:0 2px 10px rgba(0,0,0,.6)}
.logo b{color:var(--seal);font-weight:400}
.tagline{font-family:"Roboto Mono",monospace;font-size:10px;color:var(--ivory-3);letter-spacing:.24em;margin-top:4px}
.spacer{flex:1}
.chip{font-family:"Roboto Mono",monospace;font-size:11px;letter-spacing:.06em;color:var(--ivory-2);
  border:1px solid var(--edge);border-radius:999px;padding:3px 11px;background:rgba(10,30,26,.7);
  white-space:nowrap;font-variant-numeric:tabular-nums}
.chip b{color:var(--brass);font-weight:700}
.tbtn{background:rgba(10,30,26,.7);border:1px solid var(--edge);border-radius:999px;padding:5px 14px;
  font-size:13px;color:var(--ivory-2);transition:.16s}
.tbtn:hover{border-color:var(--brass);color:var(--brass-hot)}

/* ═══ フェルト卓 ═══ */
/* z-index:0 は必須。これが無いと卓が独自の重ね順を作らず、中の .tableedge(6) などが
   外へ漏れて手札(.hand は 5)より上になり、持ち上げた札が卓のフチに隠れる。 */
.stage{position:relative;z-index:0;flex:1 1 auto;min-height:210px;border-radius:26px;
  background:radial-gradient(ellipse 78% 70% at 50% 44%, var(--felt-1) 0%, var(--felt-2) 46%, var(--felt-3) 100%);
  box-shadow:inset 0 0 0 2px rgba(217,180,95,.2), inset 0 0 140px -20px rgba(0,0,0,.75),
    inset 0 4px 20px rgba(255,255,255,.05), 0 26px 60px -26px #000;
  overflow:hidden}
.stage::before{content:"";position:absolute;inset:0;pointer-events:none;
  background-image:radial-gradient(rgba(255,255,255,.05) .8px,transparent .9px);
  background-size:4px 4px;mix-blend-mode:overlay}
.stage::after{content:"";position:absolute;inset:12px;border-radius:18px;pointer-events:none;
  border:1px solid rgba(217,180,95,.12)}
.tableedge{position:absolute;inset:0;border-radius:26px;pointer-events:none;z-index:6;
  box-shadow:inset 0 0 0 9px #241A11, inset 0 0 0 10px rgba(217,180,95,.3)}

/* ── 席 ── */
.seat{position:absolute;--cardw:40px;display:flex;flex-direction:column;align-items:center;gap:5px;
  transition:.25s;z-index:3}
.seat.s1{left:5%;top:6%} .seat.s2{left:50%;top:2%;transform:translateX(-50%)} .seat.s3{right:5%;top:6%}
.plate{display:flex;align-items:center;gap:7px;padding:3px 11px;border-radius:999px;
  background:rgba(6,20,17,.66);border:1px solid rgba(217,180,95,.22)}
.seat.on .plate{border-color:var(--brass);box-shadow:0 0 0 1px var(--brass),0 0 24px -6px var(--brass)}
.pname{font-weight:700;font-size:12.5px;letter-spacing:.04em}
.pcnt{font-family:"Roboto Mono",monospace;font-size:10.5px;color:var(--ivory-3);font-variant-numeric:tabular-nums}
.badge{font-family:"Roboto Mono",monospace;font-size:9px;letter-spacing:.1em;padding:0 5px;
  border:1px solid currentColor;border-radius:999px;line-height:14px}
.badge.onu{color:var(--seal);background:rgba(216,56,47,.16)}
.badge.deal{color:var(--brass-dim)}
.fan{display:flex;align-items:flex-start;min-height:60px}
.fan .card{margin-left:-26px;transform:rotate(var(--rot,0deg)) translateY(var(--dy,0px));
  transition:transform .3s cubic-bezier(.3,.9,.3,1)}
.fan .card:first-child{margin-left:0}

/* ── 中央 ── */
.middle{--cardw:98px;position:absolute;left:50%;top:50%;transform:translate(-50%,-48%);
  display:flex;align-items:flex-start;gap:clamp(20px,4.5vw,46px);z-index:2}
.slot{display:flex;flex-direction:column;align-items:center;gap:8px}
.slab{font-family:"Roboto Mono",monospace;font-size:10px;letter-spacing:.16em;color:rgba(241,237,226,.55);
  white-space:nowrap}
.slab b{color:var(--brass);font-weight:700}
.deckslot{position:relative}
.deckslot .card{position:relative;z-index:2}
.deckslot::before,.deckslot::after{content:"";position:absolute;inset:0;border-radius:9px;
  background:#0B0C10;border:1px solid rgba(255,255,255,.1)}
.deckslot::before{transform:translate(3px,3px) rotate(1.6deg)}
.deckslot::after{transform:translate(6px,6px) rotate(3deg)}
.deckslot.hit .card{animation:deckhit .32s}
@keyframes deckhit{50%{transform:translateY(-8px) rotate(-3deg)}}
.discard{position:relative;width:var(--cardw);height:calc(var(--cardw)*1.5)}
.discard .card{position:absolute;left:0;top:0}
.discard .card.top{box-shadow:var(--lift),0 0 36px -6px var(--glow,transparent)}
.discard.hold .card.top{opacity:0}

.dial{position:absolute;left:50%;top:50%;width:min(52%,300px);aspect-ratio:1;transform:translate(-50%,-44%);
  pointer-events:none;z-index:1;opacity:.9}
.dial svg{width:100%;height:100%;overflow:visible;transition:transform .5s cubic-bezier(.3,.9,.3,1)}
.dial.rev svg{transform:scaleX(-1)}
.dial circle{fill:none;stroke:rgba(217,180,95,.16);stroke-width:.8;stroke-dasharray:2 12}
.dial path{fill:var(--brass);opacity:.42;transform-box:fill-box;transform-origin:center;transform:scale(.62)}
.dial g{transform-origin:50% 50%;animation:spin 30s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── ログ ── */
.log{position:absolute;left:18px;bottom:30px;width:min(260px,42%);z-index:4;pointer-events:none;
  font-family:"Roboto Mono",monospace;font-size:11px;line-height:1.8;
  display:flex;flex-direction:column-reverse;gap:1px;
  -webkit-mask-image:linear-gradient(to top,#000 60%,transparent);
  mask-image:linear-gradient(to top,#000 60%,transparent)}
.log i{font-style:normal;color:rgba(241,237,226,.62);animation:logIn .35s;text-shadow:0 1px 3px rgba(0,0,0,.7)}
body.tut .log{display:none}
.log i.hi{color:var(--brass)} .log i.sl{color:#F5928A}
@keyframes logIn{from{opacity:0;transform:translateY(4px)}}

/* ── 受付時間のバー ── */
.inplay{position:absolute;left:18px;right:18px;bottom:6px;height:20px;display:flex;align-items:center;gap:10px;z-index:5}
.ip-lab{font-family:"Roboto Mono",monospace;font-size:9.5px;letter-spacing:.22em;white-space:nowrap;
  color:rgba(241,237,226,.35);transition:color .2s}
.ip-lab.on{color:var(--brass-hot);text-shadow:0 0 12px rgba(217,180,95,.6)}
.ip-lab.out{color:#F5928A}
.ip-track{flex:1;height:2px;background:rgba(255,255,255,.1);position:relative;overflow:hidden;border-radius:2px}
.ip-fill{position:absolute;inset:0;background:linear-gradient(90deg,var(--brass-hot),var(--seal));
  transform-origin:left;transform:scaleX(0);border-radius:2px}

/* ═══ レール ═══ */
.rail{position:relative;border-radius:20px;padding:0 16px 12px;
  background:linear-gradient(180deg,var(--rail-1),var(--rail-2));
  box-shadow:inset 0 1px 0 rgba(217,180,95,.32), inset 0 0 60px -20px #000, 0 16px 40px -24px #000}
.railhead{display:flex;align-items:baseline;gap:12px;padding:2px 2px 0;flex-wrap:wrap}
.me{font-weight:900;font-size:14px;letter-spacing:.05em}
.meta{font-family:"Roboto Mono",monospace;font-size:10.5px;color:rgba(241,237,226,.5);font-variant-numeric:tabular-nums}
.meta b{color:var(--brass)}
.hand{display:flex;justify-content:center;align-items:flex-end;min-height:calc(var(--cardw)*1.5 + 20px);
  padding-top:6px;margin-top:-32px;position:relative;z-index:5}
.hand .card{margin-left:var(--ov,-20px);
  transform:rotate(var(--rot,0deg)) translateY(var(--dy,0px));
  transition:transform .22s cubic-bezier(.3,.9,.3,1),filter .2s,box-shadow .2s;z-index:1}
.hand .card:first-child{margin-left:0}
.hand .card.in{animation:dealIn .42s cubic-bezier(.2,.9,.3,1) backwards}
.hand .card{will-change:transform}
@keyframes dealIn{from{opacity:0;transform:translateY(70px) rotate(0deg) scale(.8)}}
button.card:hover:not(:disabled){transform:rotate(0deg) translateY(-18px) scale(1.04);z-index:9}
button.card:disabled{cursor:default;filter:brightness(.42) saturate(.3) contrast(.92)}
button.card.sel{transform:rotate(0deg) translateY(-20px) scale(1.05);z-index:8;
  box-shadow:0 0 0 3px var(--brass-hot),0 0 30px -4px var(--brass),var(--lift)}

/* ═══ カード ═══ */
.card{width:var(--cardw);height:calc(var(--cardw)*1.5);border-radius:calc(var(--cardw)*.1);
  flex:none;padding:calc(var(--cardw)*.055);background:#FBFAF7;box-shadow:var(--lift);
  display:block;border:0;position:relative}
.face{position:absolute;inset:calc(var(--cardw)*.055);border-radius:calc(var(--cardw)*.07);
  background:var(--cc);overflow:hidden}
.face::before{content:"";position:absolute;left:50%;top:50%;width:67%;height:110%;
  background:#FBFAF7;border-radius:50%;transform:translate(-50%,-50%) rotate(40deg)}
.big{position:absolute;inset:0;display:grid;place-items:center;z-index:2;
  font-family:"Archivo Black",sans-serif;color:var(--cc);line-height:1;
  font-size:calc(var(--cardw)*.5);transform:skewX(-9deg) translateY(-5%);
  text-shadow:0 2px 0 rgba(0,0,0,.13)}
.big.sym{font-family:"Zen Kaku Gothic New",sans-serif;font-weight:900;font-size:calc(var(--cardw)*.34);
  letter-spacing:-.02em;transform:skewX(-9deg)}
.cor{position:absolute;z-index:3;font-family:"Archivo Black",sans-serif;color:#FBFAF7;
  font-size:calc(var(--cardw)*.2);line-height:1;text-shadow:0 1px 2px rgba(0,0,0,.45)}
.cor.tl{top:5%;left:7%} .cor.br{bottom:5%;right:7%;transform:rotate(180deg)}
.mark{position:absolute;z-index:3;bottom:4.5%;left:0;right:0;text-align:center;
  font-family:"Dela Gothic One",sans-serif;font-size:calc(var(--cardw)*.13);letter-spacing:.14em;
  color:rgba(251,250,247,.72);transform:skewX(-11deg);text-shadow:0 1px 2px rgba(0,0,0,.4)}
.c-r{--cc:var(--r)} .c-y{--cc:var(--y)} .c-g{--cc:var(--g)} .c-b{--cc:var(--b)} .c-w{--cc:var(--w)}
.c-w .face::before{background:conic-gradient(from -40deg,var(--r) 0 25%,var(--y) 0 50%,var(--g) 0 75%,var(--b) 0)}
.c-w .big{color:#FBFAF7;text-shadow:0 2px 7px rgba(0,0,0,.75)}
.c-w .mark{color:rgba(251,250,247,.9)}
.card.back .face{background:#101116}
.card.back .face::before{background:var(--seal);width:74%;height:96%;transform:translate(-50%,-50%) rotate(40deg)}
.card.back .onu{position:absolute;inset:0;display:grid;place-items:center;z-index:2;
  font-family:"Dela Gothic One",sans-serif;color:var(--y);font-size:calc(var(--cardw)*.3);
  transform:skewX(-13deg) rotate(-40deg);
  text-shadow:-1.5px 0 #FBFAF7,1.5px 0 #FBFAF7,0 -1.5px #FBFAF7,0 1.5px #FBFAF7,0 3px 6px rgba(0,0,0,.55)}

/* ═══ 飛ぶカード ═══ */
.fx{position:fixed;inset:0;pointer-events:none;z-index:70;perspective:1500px}
.fly{position:absolute;transform-style:preserve-3d}
.fly .side{position:absolute;inset:0;backface-visibility:hidden}
.fly .side.b{transform:rotateY(180deg)}

/* ═══ 操作 ═══ */
.ctl{display:flex;gap:9px;flex-wrap:wrap;align-items:center;justify-content:center;min-height:40px}
.hint{font-size:13.5px;color:rgba(241,237,226,.6);text-align:center;min-height:20px;margin-top:4px}
.hint b{color:var(--brass-hot)}
.btn{border:1px solid rgba(217,180,95,.4);background:rgba(10,26,22,.72);border-radius:999px;
  padding:11px 22px;font-weight:700;font-size:15px;transition:.16s;color:var(--ivory)}
.btn:hover:not(:disabled){border-color:var(--brass-hot);color:var(--brass-hot);transform:translateY(-2px);
  box-shadow:0 8px 20px -10px var(--brass)}
.btn:disabled{opacity:.3;cursor:default}
.btn.pri{background:linear-gradient(180deg,var(--brass-hot),var(--brass));border-color:var(--brass-hot);
  color:#20180A;font-weight:900}
.btn.pri:hover:not(:disabled){color:#20180A;filter:brightness(1.08)}
.btn.onu{background:linear-gradient(180deg,#E8544A,var(--seal));border-color:#F2A19B;color:#fff;
  font-family:"Dela Gothic One",sans-serif;font-weight:400;letter-spacing:.12em;animation:beat 1s infinite}
.btn.onu:hover{color:#fff}
.btn.react{border-color:var(--brass-hot);color:var(--brass-hot);animation:beat 1.15s infinite}
@keyframes beat{0%,100%{box-shadow:0 0 0 0 rgba(217,180,95,.5)}55%{box-shadow:0 0 0 9px rgba(217,180,95,0)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}

[hidden]{display:none!important}
/* ═══ コーチ（チュートリアル） ═══ */
/* ── 画面いちばん下に置く、独立したメッセージウィンドウ ── */
.coach{position:relative;z-index:30;margin:8px 0 2px;
  display:flex;flex-direction:column;align-items:stretch;gap:0;
  background:linear-gradient(180deg,#142C24,#091714);
  border:2px solid var(--brass);border-radius:16px;
  padding:18px 18px 15px;min-height:106px;
  box-shadow:0 -10px 44px -14px #000, 0 20px 50px -22px #000,
    inset 0 1px 0 rgba(245,218,154,.28), inset 0 0 0 1px rgba(0,0,0,.55);
  animation:msgIn .22s ease-out}
@keyframes msgIn{from{opacity:0;transform:translateY(10px)}}
/* 肩の見出し。「読むところ」か「操作するところ」かが一目で分かる */
.coach::before{content:"せつめい";position:absolute;top:-12px;left:20px;
  background:var(--seal);color:#fff;font-size:11.5px;font-weight:700;letter-spacing:.14em;
  padding:3px 14px;border-radius:999px;box-shadow:0 4px 12px -4px #000;white-space:nowrap}
.coach.do::before{content:"あなたの番";background:linear-gradient(180deg,var(--brass-hot),var(--brass));color:#20180A}
.coach.stop{cursor:pointer}
.coach .body{flex:1;min-width:0}
.coach p{margin:0;font-size:19px;line-height:1.9;color:#FBFAF7;letter-spacing:.015em}
.coach p em{font-style:normal;color:var(--brass-hot);font-weight:700}
/* 「次へ」— 送れることが一目で分かるように、光らせて置く */
/* 下段：進め方の案内。説明文とは別立てで常に見えている */
.coach .foot{display:flex;align-items:center;justify-content:flex-end;gap:12px;margin-top:12px;min-height:22px}
/* 最初の数回だけ出す案内。枠も背景も付けない、光る素の文字 */
.coach .tapline{font-size:14.5px;font-weight:800;letter-spacing:.05em;color:#FFEEC0;
  text-shadow:0 0 14px rgba(245,218,154,.9),0 0 36px rgba(217,180,95,.55),0 2px 8px rgba(0,0,0,.9);
  animation:hintGlow 2.3s ease-in-out infinite}
@keyframes hintGlow{0%,100%{opacity:.72;transform:translateY(1px)}50%{opacity:1;transform:translateY(-3px)}}
.coach .tapline.out{animation:hintOut .6s ease-out forwards}
@keyframes hintOut{to{opacity:0;transform:translateY(-10px)}}
/* 「次がある」合図の ▼。ボタンではないので、枠のどこを押しても進む */
.coach .caret{flex:none;pointer-events:none;font-size:19px;line-height:1;color:var(--brass-hot);
  text-shadow:0 2px 8px rgba(217,180,95,.55);opacity:0;transition:opacity .2s}
.coach .caret.on{opacity:1;animation:caretBob 1s ease-in-out infinite}
@keyframes caretBob{0%,100%{transform:translateY(-2px)}50%{transform:translateY(3px)}}
body.holding #ctl,body.holding .hand{pointer-events:none}
body.holding #ctl{opacity:.4}
body.tut .hand{margin-top:8px}
.hand .card.aim{transform:rotate(0deg) translateY(-16px);z-index:7;
  box-shadow:0 0 0 3px var(--brass-hot),0 0 28px -2px var(--brass),var(--lift)}
.btn.aim{box-shadow:0 0 0 3px var(--brass-hot),0 8px 20px -10px var(--brass)}
#hand.aim,#discard.aim,#deckslot.aim,.seat.aim{
  box-shadow:0 0 0 3px var(--brass-hot),0 0 34px -4px var(--brass);border-radius:14px}
#deckslot.aim{border-radius:10px}
.demo{position:fixed;inset:0;z-index:76;pointer-events:none}
.demo svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.demo path{fill:none;stroke:var(--brass-hot);stroke-width:2.5;stroke-linecap:round;
  stroke-dasharray:6 7;animation:dash .7s linear infinite,fadeIn .25s}
@keyframes dash{to{stroke-dashoffset:-26}}
.dchip{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;
  font-family:"Zen Kaku Gothic New",sans-serif;font-weight:700;font-size:13px;
  padding:4px 10px;border-radius:999px;background:#12251F;color:var(--brass-hot);
  border:1.5px solid var(--brass-hot);box-shadow:0 6px 16px -8px #000;animation:pop .28s cubic-bezier(.2,1.2,.4,1)}
.dchip.no{color:#F5928A;border-color:#F5928A}
.dchip.pt{color:#FBFAF7;border-color:rgba(251,250,247,.5);background:#1B3830}
.dchip.big{font-size:16px;padding:6px 14px}
.dchip.up{animation:popUp 1.1s cubic-bezier(.2,.9,.3,1) forwards}
@keyframes pop{from{opacity:0;transform:translate(-50%,-50%) scale(.7)}}
@keyframes popUp{0%{opacity:0;transform:translate(-50%,-30%) scale(.8)}
  25%{opacity:1;transform:translate(-50%,-50%) scale(1)}
  100%{opacity:1;transform:translate(-50%,-95%) scale(1)}}
@keyframes fadeIn{from{opacity:0}}
.dring{position:absolute;border-radius:14px;border:3px solid var(--brass-hot);
  box-shadow:0 0 26px -4px var(--brass);animation:pop .3s cubic-bezier(.2,1.2,.4,1)}
.arrow{position:fixed;z-index:78;pointer-events:none;width:32px;height:44px;margin-left:-16px;
  animation:bob .8s ease-in-out infinite}
.arrow.up{transform:rotate(180deg);animation-name:bobUp}
.arrow svg{width:100%;height:100%;display:block;filter:drop-shadow(0 4px 8px rgba(0,0,0,.6))}
.arrow path{fill:var(--brass-hot);stroke:#20180A;stroke-width:2.5;stroke-linejoin:round}
@keyframes bob{0%,100%{margin-top:-7px}50%{margin-top:3px}}
@keyframes bobUp{0%,100%{margin-top:7px}50%{margin-top:-3px}}

body.holding #ctl,body.holding .hand{pointer-events:none}
body.holding #ctl{opacity:.45}
.lessonlist li{margin-bottom:7px}
.lessonlist em{font-style:normal;color:var(--brass-hot);font-weight:700}

/* ═══ 判子 ═══ */
.seal{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;z-index:90;opacity:0}
.seal.go{animation:seal 1s ease-out}
.seal span{font-family:"Dela Gothic One",sans-serif;color:#fff;background:var(--seal);
  border:7px solid #fff;border-radius:12px;padding:8px 30px 16px;transform:rotate(-12deg);
  box-shadow:0 26px 60px -20px #000;letter-spacing:.1em;font-size:clamp(52px,13vw,110px)}

<script>
"use strict";
/* ═══════════ 効果音 ═══════════
   外部音源は使わず Web Audio で合成する。カード系は正弦波の「ピコ音」ではなく、
   帯域を絞った短いノイズ（＝紙が擦れる音）と低域の当たり音を重ねて作る。 */
const SFX=(()=>{
  let ctx=null, master=null, noiseBuf=null, on=true;
  try{ on=localStorage.getItem("onu.sound")!=="0"; }catch(e){}
  function boot(){
    if(ctx)return true;
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC)return false;
    try{
      ctx=new AC();
      master=ctx.createGain(); master.gain.value=.8; master.connect(ctx.destination);
      const len=Math.floor(ctx.sampleRate*1.2);
      noiseBuf=ctx.createBuffer(1,len,ctx.sampleRate);
      const d=noiseBuf.getChannelData(0);
      for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
    }catch(e){ ctx=null; return false; }
    return true;
  }
  // 帯域を絞ったノイズ＝紙・布の擦れ
  function noise(at,dur,o){
    o=o||{};
    const src=ctx.createBufferSource();
    src.buffer=noiseBuf; src.loop=true;
    src.playbackRate.value=.85+Math.random()*.3;
    const f=ctx.createBiquadFilter();
    f.type=o.type||"bandpass"; f.Q.value=o.q==null?1:o.q;
    if(o.sweep){ f.frequency.setValueAtTime(o.sweep[0],at);
                 f.frequency.exponentialRampToValueAtTime(o.sweep[1],at+dur); }
    else f.frequency.setValueAtTime(o.f||1800,at);
    const g=ctx.createGain(), peak=o.g==null?.3:o.g;
    g.gain.setValueAtTime(.0001,at);
    g.gain.exponentialRampToValueAtTime(peak,at+(o.atk||.004));
    g.gain.exponentialRampToValueAtTime(.0001,at+dur);
    src.connect(f); f.connect(g); g.connect(master);
    src.start(at); src.stop(at+dur+.03);
  }
  function tone(at,dur,o){
    o=o||{};
    const osc=ctx.createOscillator();
    osc.type=o.type||"sine";
    osc.frequency.setValueAtTime(o.f||440,at);
    if(o.f2)osc.frequency.exponentialRampToValueAtTime(o.f2,at+dur);
    const g=ctx.createGain(), peak=o.g==null?.12:o.g;
    g.gain.setValueAtTime(.0001,at);
    g.gain.exponentialRampToValueAtTime(peak,at+(o.atk||.008));
    g.gain.exponentialRampToValueAtTime(.0001,at+dur);
    osc.connect(g); g.connect(master);
    osc.start(at); osc.stop(at+dur+.03);
  }
  const go=fn=>{
    if(!on||!boot())return;
    if(ctx.state==="suspended")ctx.resume();
    try{ fn(ctx.currentTime); }catch(e){}
  };
  const api={
    unlock(){ if(on&&boot()&&ctx.state==="suspended")ctx.resume(); },
    enabled(){ return on; },
    toggle(){ on=!on; try{localStorage.setItem("onu.sound",on?"1":"0");}catch(e){} if(on)api.unlock(); return on; },
    // 1枚滑らせる（配る・引く）
    deal(d){ go(t=>{ const a=t+(d||0);
      noise(a,.085,{sweep:[2900,820],q:1.1,g:.17});
      tone(a,.05,{f:150,f2:78,g:.04}); }); },
    // 場に置く（フェルトに当たる）
    place(d){ go(t=>{ const a=t+(d||0);
      noise(a,.13,{sweep:[2100,520],q:.9,g:.28});
      noise(a+.012,.045,{f:3600,q:1.6,g:.09});
      tone(a,.11,{f:112,f2:60,g:.15}); }); },
    // めくる
    flip(d){ go(t=>{ const a=t+(d||0);
      noise(a,.07,{sweep:[620,2700],q:1.4,g:.12});
      noise(a+.062,.10,{sweep:[2700,900],q:1.1,g:.24});
      tone(a+.062,.07,{f:132,f2:74,g:.06}); }); },
    // 山を切る
    shuffle(d){ go(t=>{ const a=t+(d||0);
      for(let i=0;i<18;i++)
        noise(a+i*.028+Math.random()*.012,.035,
          {f:1200+Math.random()*1900,q:1.5,g:.07+Math.random()*.05}); }); },
    pick(){ go(t=>{ noise(t,.035,{f:2700,q:2.2,g:.14}); tone(t,.04,{f:540,g:.035,type:"triangle"}); }); },
    unpick(){ go(t=>{ noise(t,.028,{f:1700,q:2.2,g:.09}); }); },
    btn(){ go(t=>{ noise(t,.03,{f:1500,q:1.8,g:.12}); tone(t,.05,{f:300,f2:200,g:.045,type:"triangle"}); }); },
    skip(){ go(t=>{ noise(t,.20,{sweep:[2700,520],q:2.4,g:.19}); }); },
    reverse(){ go(t=>{ noise(t,.24,{sweep:[520,2700],q:2.4,g:.17});
      tone(t,.24,{f:180,f2:430,g:.045,type:"triangle"}); }); },
    onu(){ go(t=>{ tone(t,.55,{f:988,g:.12}); tone(t,.4,{f:1976,g:.03});
      tone(t+.085,.5,{f:1319,g:.09}); }); },
    spe(){ go(t=>{ [784,988,1319,1568].forEach((f,i)=>
      tone(t+i*.075,.5-i*.055,{f,g:.10-i*.014})); }); },
    win(){ go(t=>{ [523,659,784,1047].forEach((f,i)=>
      tone(t+i*.09,.6-i*.06,{f,g:.11-i*.011})); }); },
    over(){ go(t=>{ tone(t,.42,{f:392,g:.08}); tone(t+.12,.5,{f:294,g:.07}); }); },
    notify(){ go(t=>{ tone(t,.16,{f:660,g:.05}); tone(t+.07,.2,{f:880,g:.045}); }); }
  };
  return api;
})();
// 最初の操作で音を解禁し、ボタン類にはクリック音を付ける
addEventListener("pointerdown",e=>{
  SFX.unlock();
  const t=e.target&&e.target.closest?e.target.closest(".btn,.tbtn,.cpick,.coach .x"):null;
  if(t&&!t.disabled)SFX.btn();
},true);

/* ═══════════ カード ═══════════ */
const COLORS=["r","y","g","b"];
const CN={r:"赤",y:"黄",g:"緑",b:"青",w:"黒"};
const SYM={skip:"⊘",rev:"⇄",d2:"+2",wild:"W",wd4:"+4"};
const SNAME={skip:"スキップ",rev:"リバース",d2:"ドロー2",wild:"ワイルド",wd4:"ワイルドドロー4"};
let UID=0;
const mk=(color,kind,num)=>({id:++UID,color,kind,num});
const pts=c=>c.kind==="num"?c.num:(c.color==="w"?20:10);
const isSym=c=>c.kind!=="num";
const key=c=>c.kind==="num"?"n"+c.num:c.kind;
const cname=c=>c.kind==="num"?CN[c.color]+c.num:(c.color==="w"?SNAME[c.kind]:CN[c.color]+SNAME[c.kind]);
const sum=h=>h.reduce((a,c)=>a+pts(c),0);

function buildDeck(){
  const d=[];
  for(const col of COLORS){
    d.push(mk(col,"num",0));
    for(let n=1;n<=9;n++){d.push(mk(col,"num",n));d.push(mk(col,"num",n));}
    for(const k of ["skip","rev","d2"]){d.push(mk(col,k));d.push(mk(col,k));}
  }
  for(let i=0;i<4;i++){d.push(mk("w","wild"));d.push(mk("w","wd4"));}
  return d;
}
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;};

/* 見た目 */
function faceHTML(c){
  const f=c.kind==="num"?c.num:SYM[c.kind];
  return `<div class="face"></div><div class="big${c.kind==="num"?"":" sym"}">${f}</div>
    <span class="cor tl">${f}</span><span class="cor br">${f}</span><span class="mark">ONU</span>`;
}
const backHTML=()=>`<div class="face"></div><div class="onu">ONU</div>`;
const cardEl=(c,tag,cls,style)=>
  `<${tag} class="card c-${c.color} ${cls||""}" style="${style||""}" data-id="${c.id}" aria-label="${cname(c)}">${faceHTML(c)}</${tag}>`;
const backEl=style=>`<div class="card back" style="${style||""}">${backHTML()}</div>`;

/* ═══════════ チュートリアルの台本 ═══════════ */
// "r5"=赤5 / "rS"=赤スキップ / "rR"=赤リバース / "rD"=赤ドロー2 / "W"=ワイルド / "W4"=ワイルドドロー4
function pc(str){
  if(str==="W")return mk("w","wild");
  if(str==="W4")return mk("w","wd4");
  const col=str[0],rest=str.slice(1);
  if(rest==="S")return mk(col,"skip");
  if(rest==="R")return mk(col,"rev");
  if(rest==="D")return mk(col,"d2");
  return mk(col,"num",+rest);
}
const eqc=(a,b)=>a.color===b.color&&a.kind===b.kind&&a.num===b.num;
// 毎回同じ並びになる決定論的シャッフル（台本の再現性のため）
function seededShuffle(a,seed){
  let t=seed>>>0;
  const rnd=()=>{t=(Math.imul(t,1664525)+1013904223)>>>0;return t/4294967296;};
  for(let i=a.length-1;i>0;i--){const j=(rnd()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
// 使用済みを除いた残りを山にし、引かせたい札を上に積む
function stackDeck(used,planned,seed){
  const rest=buildDeck();
  for(const u of used.concat(planned)){
    const i=rest.findIndex(c=>eqc(c,u));
    if(i>=0)rest.splice(i,1);
  }
  return seededShuffle(rest,seed).concat(planned.slice().reverse());
}
const SCENES={
 // 1) 出す・引く → CPUが上がってラウンド終了。得点の付き方を見る
 1:{field:"r4",start:0,draw:["b2"],script:["b7","b5","b1","b9"],
    hands:[["b4","y2","g9"],
           ["b7","b9"],
           ["b5","y8"],
           ["b1","g3"]]},
 // 2) 重ねだしと文字カード → あなたが重ね上がり（0点）
 2:{field:"g2",start:0,draw:[],script:["gR","g7"],
    hands:[["gS","r7","b7"],
           ["g7","b3","y6"],
           ["gR","y8","r9"],
           ["r5","y1","g8"]]},
 // 3) ワイルドとドロー返し → 重ねて押しつけ、引いている間は誰も出せないことを見る

const NAMES=["あなた","コウ","ミナ","レン"];
let REACT_MS=6000;
const PACES={relaxed:{label:"ゆっくり",ms:6000,reaction:3400,eye:.45,jump:.25},standard:{label:"スタンダード",ms:3000,reaction:1500,eye:.65,jump:.45},expert:{label:"チャレンジ",ms:2200,reaction:800,eye:.9,jump:.7}};
let selectedPace="relaxed";
const CPU_MIN=700, CPU_VAR=550, SPE_EYE=0.65;
const MOTION=!matchMedia("(prefers-reduced-motion: reduce)").matches;
let G=null, sel=new Set(), timers=[];
const clearTimers=()=>{
  timers.forEach(r=>clearTimeout(r.id)); timers=[];
  if(G){ G.held=[]; if(G.hold)releaseHold(); }
};
const later=(fn,ms)=>{
  const r={fn,ms,start:Date.now(),id:null};
  if(G&&G.hold){ G.held.push(r); return r; }
  r.id=setTimeout(()=>{ timers=timers.filter(x=>x!==r); r.fn(); },ms);
  timers.push(r); return r;
};
// 説明のあいだ卓を止める。走っているタイマーは残り時間ごと預かる
function holdGame(){
  if(!G||G.hold)return;
  G.hold=true; G.held=G.held||[];
  const now=Date.now();
  timers.forEach(r=>{ clearTimeout(r.id); r.ms=Math.max(0,r.ms-(now-r.start)); G.held.push(r); });
  timers=[];
  const f=$("ipFill");
  if(G.ipEnd){ G.ipLeft=Math.max(0,G.ipEnd-now); }
  f.style.transition="none"; f.style.transform=getComputedStyle(f).transform;
  document.body.classList.add("holding");
}
function releaseHold(){ G.hold=false; document.body.classList.remove("holding"); }
function resumeGame(){
  if(!G||!G.hold)return;
  releaseHold();
  const q=G.held||[]; G.held=[];
  q.forEach(r=>later(r.fn,r.ms));
  const f=$("ipFill");
  if(G.ipLeft>0){
    const left=G.ipLeft; G.ipLeft=0; G.ipEnd=Date.now()+left;
    requestAnimationFrame(()=>{ f.style.transition="transform "+left+"ms linear"; f.style.transform="scaleX(0)"; });
  }
}
const $=id=>document.getElementById(id);

function newGame(maxRounds,tmode){
  G={maxRounds,round:0,totals:[0,0,0,0],history:[],dealer:0,lastWinner:null,players:null,
     tutorial:!!tmode,tmode:tmode||null,pace:PACES[selectedPace],seats:[0,1,2,3],
     tips:new Set(),hold:false,held:[],ipEnd:0,ipLeft:0,active:null};
  REACT_MS=tmode?4600:G.pace.ms;
  if(tmode)startRound(); else decideSeats();
}
function nextSeat(pi,steps=1){return G.seats[((G.seats.indexOf(pi)+G.dir*steps)%4+4)%4];}
function decideSeats(){
  const deck=shuffle(buildDeck()),draws=NAMES.map((_,i)=>({i,c:deck.pop(),ties:[]}));
  function sortGroup(group){
    group.sort((a,b)=>pts(b.c)-pts(a.c));
    const out=[];
    for(let j=0;j<group.length;){
      let end=j+1;while(end<group.length&&pts(group[end].c)===pts(group[j].c))end++;
      const same=group.slice(j,end);
      if(same.length>1){
        const tieDeck=shuffle(buildDeck());
        same.forEach(x=>{x.ties.push(x.c);x.c=tieDeck.pop();});
        out.push(...sortGroup(same));
      }else out.push(...same);
      j=end;
    }
    return out;
  }
  const order=sortGroup(draws); G.seats=order.map(x=>x.i);G.firstStarter=G.seats[0];G.dealer=G.seats[3];
  open(`<div class="kicker">TAKE YOUR SEAT</div><h2>最初の順番が決まりました</h2><p>1枚ずつ引き、点数の大きい順に時計回り。同点の人は引き直しました。</p><div class="seat-draws">${order.map(x=>`<div>${cardEl(x.ties[0]||x.c,"div","")}<b>${NAMES[x.i]}</b><span>${pts(x.ties[0]||x.c)}点${x.ties.length?` · 同点の引き直し ${x.ties.slice(1).concat(x.c).map(pts).join(" → ")}点`:""}</span></div>`).join("")}</div><p><b>${NAMES[G.firstStarter]}</b>から開始。カード配りは${NAMES[G.dealer]}です。各自7枚、${G.maxRounds}ラウンドで競います。</p><div class="rowbtns"><button class="btn pri" id="seatGo">この席で始める</button></div>`,false);
  $("seatGo").onclick=()=>{close();startRound();};
}
function startRound(){
  clearTimers(); sel.clear(); hideCoach();
  G.round++;
  if(G.tutorial&&lessonFor(G.round)){ showLesson(G.round); return; }
  dealRound();
}
function dealRound(){
  clearTimers(); sel.clear(); hideCoach();
  G.discard=[];
  G.players=NAMES.map((n,i)=>({name:n,human:i===0,hand:[],onu:false,forgot:false,drew16:false}));
  const S=G.tutorial?SCENES[G.round]:null;
  G.scene=S;
  G.script=null;
  let top;
  if(S){
    const used=[];
    S.hands.forEach((h,i)=>{ G.players[i].hand=h.map(x=>{const c=pc(x);used.push(c);return c;}); });
    top=pc(S.field); used.push(top);
    G.deck=stackDeck(used,S.draw.map(pc),G.round*7919+13);
    G.turn=S.start; G.script=S.script.slice();
  } else {
    G.deck=shuffle(buildDeck());
    for(let r=0;r<7;r++)for(const p of G.players)p.hand.push(G.deck.pop());
    for(;;){ top=G.deck.pop(); if(!isSym(top))break; G.deck.unshift(top); }
    G.turn=G.lastWinner==null?G.firstStarter:G.lastWinner;
  }
  G.discard.push(top); G.top=top; G.color=top.color;
  G.dir=1; G.pending=null; G.phase="deal";G.outLock=false;
  G.lastPlay=null; G.chain=null; G.canPass=false; G.logs=[]; G.flying=0; G.hideTop=true;
  G.hold=false; G.held=[]; G.ipEnd=0; G.ipLeft=0; G.active=null;
  document.body.classList.remove("holding"); document.body.classList.toggle("tut",!!G.tutorial);
  hideArrow(); demoClear(); G.sayQ=null; G.sayI=0;
  say(`— 第${G.round}ラウンド —`,"hi");
  render();
  dealAnimation(()=>{
    G.hideTop=false; render();
    say(`場は ${cname(G.top)}。スターターは ${NAMES[G.turn]}。`);
    if(G.tutorial){G.phase="idle"; later(beginTurn,340);}else openReact();
  });
}

/* ═══════════ 演出 ═══════════ */
const rectOf=el=>el?el.getBoundingClientRect():null;
function seatRect(pi){
  if(pi===0){ const r=rectOf($("hand")); return {left:r.left+r.width/2-30,top:r.top+14,width:60,height:90}; }
  const el=$("seat"+pi).querySelector(".fan")||$("seat"+pi);
  const r=rectOf(el); return {left:r.left+r.width/2-20,top:r.top,width:40,height:60};
}
function fly(from,to,card,opt){
  opt=opt||{};
  if(!MOTION)return null;
  const w=opt.w||from.width||60;
  const el=document.createElement("div");
  el.className="fly";
  el.style.cssText=`left:${from.left}px;top:${from.top}px;width:${w}px;height:${w*1.5}px`;
  const front=card?`<div class="side f">${cardEl(card,"div","",`--cardw:${w}px`)}</div>`:"";
  const back=`<div class="side ${card?"b":"f"}">${backEl(`--cardw:${w}px`)}</div>`;
  el.innerHTML=opt.flip?front+back:(card?front:back);
  $("fx").appendChild(el);
  const sc=(to.width||w)/w, dx=to.left-from.left, dy=to.top-from.top, spin=opt.spin||0;
  const a=el.animate([
    {transform:`translate(0,0) rotateY(${opt.flip?180:0}deg) rotate(0deg) scale(1)`},
    {transform:`translate(${dx*.5}px,${dy*.5-36}px) rotateY(${opt.flip?90:0}deg) rotate(${spin*.55}deg) scale(${1+(sc-1)*.5+.08})`,offset:.55},
    {transform:`translate(${dx}px,${dy}px) rotateY(0deg) rotate(${spin}deg) scale(${sc})`}
  ],{duration:opt.dur||430,delay:opt.delay||0,easing:"cubic-bezier(.32,.86,.34,1)",fill:"forwards"});
  a.onfinish=()=>{ el.remove(); if(opt.done)opt.done(); };
  return a;
}
function dealAnimation(done){
  if(!MOTION){ SFX.shuffle(); SFX.flip(.45); done(); return; }
  const d=rectOf($("deckslot"));
  const from={left:d.left,top:d.top,width:d.width};
  let n=0;
  const rows=Math.max.apply(null,G.players.map(p=>p.hand.length));
  for(let r=0;r<rows;r++)for(let p=0;p<4;p++){
    if(r>=G.players[p].hand.length)continue;
    const to=seatRect(p);
    fly(from,{left:to.left,top:to.top,width:p===0?d.width:d.width*.48},null,
      {delay:n*36,dur:340,spin:Math.random()*30-15});
    SFX.deal(n*.036+.20);
    n++;
  }
  SFX.flip((n*36+360)/1000+.30);
  later(()=>{
    const t=rectOf($("discard"));
    fly(from,{left:t.left,top:t.top,width:t.width},G.top,{flip:true,dur:540,spin:4});
    later(done,560);
  },n*36+360);
}
function flyPlay(pi,cards,src){
  const land=MOTION?(pi===0?.30:.40):0;
  cards.forEach((c,i)=>{ if(MOTION)SFX.deal(i*.07); SFX.place(land+i*.07); });
  if(!MOTION)return;
  const d=rectOf($("discard")), to={left:d.left,top:d.top,width:d.width};
  G.flying++; G.hideTop=true;
  const state=G;
  const done=()=>{if(G!==state)return;G.flying=Math.max(0,G.flying-1);if(!G.flying){G.hideTop=false;render();}};
  cards.forEach((c,i)=>{
    fly(src,to,c,{flip:pi!==0,dur:pi===0?340:450,delay:i*70,w:src.width,
      spin:(i-(cards.length-1)/2)*7+(Math.random()*6-3),
      done:i===cards.length-1?done:null});
  });
}
function flyDraw(pi,count){
  if(!count)return;
  for(let i=0;i<Math.min(count,8);i++)SFX.deal(i*.08+(MOTION?.18:0));
  if(!MOTION)return;

    fly({left:d.left,top:d.top,width:d.width},

/* ═══════════ ログ ═══════════ */
function say(t,cls){ G.logs.push({t,cls}); if(G.logs.length>40)G.logs.shift(); paintLog(); }
function paintLog(){ $("log").innerHTML=G.logs.slice(-6).map(l=>`<i class="${l.cls||""}">${l.t}</i>`).join(""); }

/* ═══════════ 山から引く ═══════════ */
function drawCards(pi,n){
  const p=G.players[pi],got=[];
  for(let i=0;i<n;i++){
    if(!G.deck.length){
      if(G.discard.length<2)break;
      const keep=G.discard.pop();
      G.deck=shuffle(G.discard); G.discard=[keep];
      SFX.shuffle();
      say("山切れ。捨て札を切り直して山に。");
    }
    got.push(G.deck.pop());
  }
  p.hand.push(...got);
  if(n===16&&got.length===16)p.drew16=true;
  if(p.hand.length>1){p.onu=false;p.forgot=false;}
  flyDraw(pi,got.length);
  return got;
}

/* ═══════════ 合法判定 ═══════════ */
function matches(c){
  if(c.color==="w")return true;
  if(c.color===G.color)return true;
  if(c.kind==="num"&&G.top.kind==="num"&&c.num===G.top.num)return true;
  if(isSym(c)&&G.top.kind===c.kind)return true;
  return false;
}
function validPlay(hand,cards){
  if(!cards.length)return "カードを選んでください";
  if(new Set(cards.map(c=>c.id)).size!==cards.length||cards.some(c=>!hand.includes(c)))return "手札から選んでください";
  const k=key(cards[0]);
  if(cards.some(c=>key(c)!==k))return "重ねだしは同じ数字／同じ文字だけ";
  if(cards.length===hand.length&&cards.some(isSym))return "上がりの札に文字カードは使えません";
  if(G.pending){
    if(cards[0].kind!==G.pending.kind)return `${SNAME[G.pending.kind]}にはそのカードを重ねられません`;
    return null;
  }
  if(!matches(cards[0]))return "場のカードと色・数字・文字が合いません";
  return null;
}
// 重ねだしの並びは、そのまま「場に置く順」。先頭は場に合う札でなければならない。
// 選んだ順を尊重しつつ、先頭が合わないときだけ合う札を先頭に繰り上げる。
function orderPlay(hand,cards){
  if(cards.length<2||!validPlay(hand,cards))return cards;
  const i=cards.findIndex(c=>!validPlay(hand,[c]));
  if(i<=0)return cards;
  const r=cards.slice(), lead=r.splice(i,1)[0];
  r.unshift(lead);
  return validPlay(hand,r)?cards:r;
}
function legalGroups(p){
  const out=[],by={};
  for(const c of p.hand){(by[key(c)]=by[key(c)]||[]).push(c);}
  for(const k in by){
    const g=by[k];
    // 先頭は場に合う札でなければならない。合う札を先頭に立ててから枚数を伸ばす
    const lead=g.find(c=>!validPlay(p.hand,[c]));
    if(!lead)continue;
    const rest=g.filter(c=>c!==lead);
    for(let n=1;n<=g.length;n++){
      const pick=[lead].concat(rest.slice(0,n-1));
      if(!validPlay(p.hand,pick))out.push(pick);
    }
  }
  return out;
}

/* ═══════════ 手番 ═══════════ */
function beginTurn(){
  if(G.phase==="over")return;
  const p=G.players[G.turn];
  G.canPass=false; sel.clear();
  if(p.forgot){ p.forgot=false;G.outLock=true;G.canPass=true;say(`${p.name} はオヌを言い忘れたまま順番が来たので1枚引く。`,"sl"); drawCards(G.turn,1); }
  if(G.pending){
    const n=G.pending.n*(G.pending.kind==="d2"?2:4);
    if(!legalGroups(p).length&&!p.human){ forcedDraw(); return; }
    say(`${p.name}：${SNAME[G.pending.kind]}を重ねるか、${n}枚引くか。`);
  }
  G.phase="turn"; render();
  if(!p.human)later(cpuTurn,CPU_MIN+Math.random()*CPU_VAR);
}
function forcedDraw(){
  if(!G.pending||!["turn","idle"].includes(G.phase))return;
  const pi=G.turn,p=G.players[pi];
  const n=G.pending.n*(G.pending.kind==="d2"?2:4);
  clearTimers();G.pending=null; G.phase="out";G.outLock=true;render(); setIP("out");
  say(`${p.name} が ${n}枚 引く（この間は誰も出せません）`,"sl");
  later(()=>{
    drawCards(pi,n);
    if(p.drew16)say(`${p.name} は一度に16枚！ 上がれば「16枚返し」。`,"hi");
    G.phase="turn"; G.canPass=true;setIP("locked");render();
    if(!p.human)later(cpuTurn,CPU_MIN);
  },900);
}

/* ═══════════ カードを出す ═══════════ */
function play(pi,cards,chosen){
  if(G.phase!=="turn"||G.turn!==pi||G.hold)return;
  const p=G.players[pi];
  if(validPlay(p.hand,cards)||cards[0].color==="w"&&!COLORS.includes(chosen))return;
  if(cards.some(c=>p.hand.indexOf(c)<0))return;   // 二重クリック対策
  clearTimers();G.outLock=false;
  let src;
  if(pi===0){
    const el=document.querySelector(`#hand .card[data-id="${cards[0].id}"]`);
    src=el?rectOf(el):seatRect(0);
  } else src=seatRect(pi);
  sel.clear();
  cards.forEach(c=>{const i=p.hand.indexOf(c);if(i>=0)p.hand.splice(i,1);});
  G.discard.push(...cards); G.top=cards[cards.length-1];
  G.color=G.top.color==="w"?chosen:G.top.color;
  G.lastPlay={by:pi,cards,n:cards.length};
  const what=cards.length>1?`${cname(cards[0])} ×${cards.length}`:cname(cards[0]);
  say(`${p.name} → ${what}${G.top.color==="w"?`（色は${CN[chosen]}）`:""}`,pi===0?"hi":"");
  flyPlay(pi,cards,src);
  if(!p.hand.length){ finish(pi,cards.length>1?"kasane":"onu"); return; }
  if(p.hand.length===1&&!p.onu){
    if(p.human)p.forgot=true;
    else if(G.tutorial?!(G.scene&&G.scene.forget===pi):Math.random()<0.85){p.onu=true;say(`${p.name}「オヌ！」`,"sl");flashSeal();}
    else p.forgot=true;
  }
  applyEffects();openReact();
}

/* ═══════════ 受付時間 ═══════════ */
function setIP(mode,ms){
  const lab=$("ipLab"),fill=$("ipFill");
  lab.className="ip-lab"+(mode==="in"?" on":mode==="out"?" out":"");
  lab.textContent=mode==="in"?"わりこみ受付":mode==="out"?"引いています":mode==="locked"?"札が出るまで受付休止":mode==="live"?"わりこみ可能":"待機";
  fill.style.transition="none"; fill.style.transform="scaleX(1)";
  G.ipLeft=0; G.ipEnd=mode==="in"?Date.now()+ms:0;
  if(mode==="in") requestAnimationFrame(()=>{
    fill.style.transition=`transform ${ms}ms linear`; fill.style.transform="scaleX(0)";
  });
  else fill.style.transform="scaleX(0)";
}
// この受付時間に、あなたにできることがあるか
function humanCanReact(){
  const me=G.players[0];
  if(me.forgot)return true;                                  // オヌ宣言
  for(let i=1;i<4;i++) if(G.players[i].forgot)return true;    // 相手の言い忘れを指摘
  const notMine=G.phase==="spe"
    ? (G.chain&&G.chain[G.chain.length-1]!==0)
    : (!G.lastPlay||G.lastPlay.by!==0);
  if(notMine&&me.hand.length>=2&&sum(me.hand)===pts(G.top)&&!me.hand.some(isSym))return true;  // オヌスペ
  if(G.phase!=="spe"&&G.lastPlay&&G.lastPlay.by!==0){          // 割り込み
    const ex=me.hand.filter(c=>canJump(0,c));
    if(ex.length&&(me.hand.length>1||me.onu))return true;
  }
  if(G.phase==="spe"&&G.chain){                               // オヌスペ破り
    const last=G.chain[G.chain.length-1];
    if(me.hand.length===1&&me.onu&&0===nextSeat(last)){
      const c=me.hand[0];
      if(!isSym(c)&&(c.color===G.color||(c.kind==="num"&&G.top.kind==="num"&&c.num===G.top.num)))return true;
    }
  }
  return false;
}
// チュートリアルでは、CPUは受付時間に動かない。あなたにも用が無ければ待たせない
const reactMs=()=>(G.tutorial&&!humanCanReact())?420:REACT_MS;
function openReact(){
  G.phase="react";
  const ms=reactMs();
  setIP("in",ms); render();
  (G.tutorial?[]:shuffle([1,2,3])).forEach((pi,idx)=>{
    later(()=>{
      if(G.phase!=="react")return;
      const p=G.players[pi];
      if(canSpe(pi)&&Math.random()<G.pace.eye){ doSpe(pi); return; }
      const ex=p.hand.filter(c=>canJump(pi,c));
      if(!ex.length)return;
      if(p.hand.length===1&&!(p.onu&&!isSym(ex[0])))return;
      if(Math.random()<G.pace.jump)doWarikomi(pi,ex[0]);
    },G.pace.reaction+idx*140+Math.random()*200);
  });
  if(!G.tutorial)G.players.forEach((p,pi)=>{
    if(!p.forgot)return;
    later(()=>{
      if(!inPlay()||!p.forgot)return;
      const accusers=[1,2,3].filter(i=>i!==pi);
      if(Math.random()>.85)return;
      p.forgot=false;
      say(`${G.players[accusers[Math.random()*accusers.length|0]].name}「オヌ言ってない！」→ ${p.name}は4枚引いた。`,"sl");
      drawCards(pi,4);render();
    },G.pace.reaction+300);
  });
  later(()=>{ if(G.phase==="react")closeReact(); },ms);
}
function closeReact(){ G.phase="idle";setIP("live");render();later(beginTurn,260); }
function applyEffects(){
  const by=G.lastPlay.by,n=G.lastPlay.n,k=G.lastPlay.cards[0].kind;
  let adv=1;
  if(k==="rev"){ if(n%2===1){G.dir*=-1;SFX.reverse();say("逆回りになった。");} else say("リバース偶数枚 → 向きはそのまま。"); }
  else if(k==="skip"){ adv=2*n; SFX.skip(); say(`${2*n}人先へ。`); }
  else if(k==="d2"||k==="wd4"){ G.pending={kind:k,n:n+(G.pending?.kind===k?G.pending.n:0)}; }
  G.turn=nextSeat(by,adv);
}
function inPlay(){return !!G&&!G.outLock&&["react","turn","spe"].includes(G.phase);}
function canSpe(pi){
  const p=G.players[pi];return inPlay()&&G.lastPlay?.by!==pi&&p.hand.length>=2&&!p.hand.some(isSym)&&sum(p.hand)===pts(G.top);
}
function canJump(pi,c){
  const p=G.players[pi];return inPlay()&&G.phase!=="spe"&&c.color===G.top.color&&key(c)===key(G.top)&&p.hand.includes(c)&&(p.hand.length>1||p.onu&&!isSym(c));
}
function canBreak(pi){
  const p=G.players[pi],c=p.hand[0],last=G.chain?.at(-1);
  return inPlay()&&G.phase==="spe"&&last!==undefined&&nextSeat(last)===pi&&p.hand.length===1&&p.onu&&!isSym(c)&&matches(c);
}

/* ═══════════ 特殊上がり ═══════════ */
function doWarikomi(pi,selection,chosen){
  const cards=Array.isArray(selection)?selection:[selection],card=cards[0],hand=G.players[pi].hand;
  if(!card||!canJump(pi,card)||G.hold||cards.some(c=>!hand.includes(c)||key(c)!==key(card))||new Set(cards).size!==cards.length)return;
  if(cards.length===hand.length&&cards.some(isSym))return;
  if(card.color==="w"&&!COLORS.includes(chosen)){
    if(pi===0){askColor(cards,color=>doWarikomi(pi,cards,color));return;}
    chosen=COLORS.reduce((a,b)=>G.players[pi].hand.filter(c=>c.color===b).length>G.players[pi].hand.filter(c=>c.color===a).length?b:a,"r");
  }
  clearTimers(); const p=G.players[pi];
  const el=pi===0?document.querySelector(`#hand .card[data-id="${card.id}"]`):null;
  const src=el?rectOf(el):seatRect(pi);
  say(`${p.name} 割り込み！ ${cards.map(cname).join("・")}`,"hi");
  cards.forEach(c=>p.hand.splice(p.hand.indexOf(c),1));
  G.discard.push(...cards); G.top=cards.at(-1); G.color=G.top.color==="w"?chosen:G.top.color;
  G.lastPlay={by:pi,cards,n:cards.length};
  flyPlay(pi,cards,src);
  if(!p.hand.length){ finish(pi,cards.length===1?"warikomi":"kasane"); return; }
  if(p.hand.length===1&&!p.onu){
    if(p.human)p.forgot=true;
    else if(G.tutorial?!(G.scene&&G.scene.forget===pi):Math.random()<0.85){p.onu=true;say(`${p.name}「オヌ！」`,"sl");}
    else p.forgot=true;
  }
  applyEffects();openReact();
}
function doSpe(pi){
  if(!canSpe(pi)||G.phase==="spe"||G.hold)return;
  clearTimers(); const p=G.players[pi],cards=p.hand.slice(),src=seatRect(pi);
  say(`${p.name}「オヌスペ！」 ${cards.length}枚 = ${sum(cards)}点`,"sl");
  p.hand.length=0;
  G.discard.push(...cards); G.top=cards[cards.length-1]; G.color=G.top.color;
  G.chain=G.chain||[]; G.chain.push(pi);
  G.lastPlay={by:pi,cards,n:cards.length};
  flyPlay(pi,cards,src); flashSeal("オヌスペ");
  render(); openSpeWindow();
}
function openSpeWindow(){
  G.phase="spe";
  const ms=reactMs();
  setIP("in",ms); render();
  const last=G.chain[G.chain.length-1];
  (G.tutorial?[]:shuffle([1,2,3])).forEach((pi,idx)=>later(()=>{
    if(G.phase!=="spe")return;
    const p=G.players[pi]; if(!p.hand.length||pi===last)return;
    if(canSpe(pi)&&Math.random()<G.pace.eye){ speReturn(pi); return; }
    if(p.hand.length===1&&p.onu&&pi===nextSeat(last)){
      const c=p.hand[0];
      if(!isSym(c)&&(c.color===G.color||(c.kind==="num"&&G.top.kind==="num"&&c.num===G.top.num))) speBreak(pi);
    }
  },G.pace.reaction+idx*140+Math.random()*200));
  later(()=>{ if(G.phase==="spe")finishChain(); },ms);
}
function speReturn(pi){
  if(G.phase!=="spe"||!canSpe(pi)||G.hold)return;
  clearTimers(); const p=G.players[pi],cards=p.hand.slice(),src=seatRect(pi);
  say(`${p.name}「オヌスペ返し！」 ${cards.length}枚 = ${sum(cards)}点`,"sl");
  p.hand.length=0; G.discard.push(...cards); G.top=cards[cards.length-1]; G.color=G.top.color;
  G.chain.push(pi); G.lastPlay={by:pi,cards,n:cards.length};
  flyPlay(pi,cards,src); flashSeal("返し"); render(); openSpeWindow();
}
function speBreak(pi){
  if(!canBreak(pi)||G.hold)return;
  clearTimers(); const p=G.players[pi],c=p.hand.pop(),src=seatRect(pi);
  say(`${p.name}「オヌスペ破り！」 ${cname(c)}`,"sl");
  G.discard.push(c); G.top=c; G.color=c.color;
  G.chain.push(pi); G.lastPlay={by:pi,cards:[c],n:1};
  flyPlay(pi,[c],src); flashSeal("破り"); render(); openSpeWindow();
}
function finishChain(){ setIP("idle"); finish(G.chain[G.chain.length-1],G.chain.length>1?"chain":"spe"); }

/* ═══════════ CPU ═══════════ */
function cpuTurn(){
  if(G.phase!=="turn")return;
  const pi=G.turn,p=G.players[pi];
  if(G.script&&G.script.length){
    const want=pc(G.script[0]);
    const card=p.hand.find(c=>eqc(c,want));
    if(card&&!validPlay(p.hand,[card])){ G.script.shift(); commitCpu(pi,[card]); return; }
  }
  const groups=legalGroups(p);
  if(!groups.length){
    if(G.pending){forcedDraw();return;}
    if(G.canPass){say(`${p.name}「なし」`);closeAfterPass();return;}
    G.outLock=true;G.canPass=true;setIP("out");
    say(`${p.name} は山から1枚引いた。`); drawCards(pi,1); render();
    later(()=>{
      const g2=legalGroups(p);
      if(g2.length&&Math.random()<0.8) commitCpu(pi,best(p,g2));
      else { say(`${p.name}「なし」`); closeAfterPass(); }
    },CPU_MIN);
    return;
  }
  commitCpu(pi,best(p,groups));
}
function best(p,groups){
  let bg=groups[0],bs=-1;
  for(const g of groups){
    let s=g.length*12+sum(g);
    if(g[0].kind==="wd4")s-=14; else if(g[0].kind==="wild")s-=8;
    if(p.hand.length-g.length===0)s+=200;
    if(p.hand.length-g.length===1)s+=25;
    const remaining=p.hand.filter(c=>!g.includes(c));
    if(remaining.length&&remaining.every(isSym))s-=45;
    if(s>bs){bs=s;bg=g;}
  }
  return bg;
}
function commitCpu(pi,cards){
  const p=G.players[pi];
  let chosen=null;
  if(cards[0].color==="w"){
    const cnt={r:0,y:0,g:0,b:0};
    p.hand.forEach(c=>{if(c.color!=="w")cnt[c.color]++;});
    chosen=COLORS.reduce((a,b)=>cnt[b]>cnt[a]?b:a,"r");
  }
  play(pi,cards,chosen);
}
function closeAfterPass(){clearTimers();G.outLock=true;G.phase="idle";G.turn=nextSeat(G.turn);setIP("locked");render();later(beginTurn,320);}

/* ═══════════ 得点 ═══════════ */
const BONUS={onu:-20,spe:-20,kasane:0,warikomi:0};
const TYPEN={onu:"オヌ上がり",spe:"オヌスペ",kasane:"重ね上がり",warikomi:"割り込み上がり",chain:"オヌスペ返し／破り"};
function finish(winner,type){
  if(G.phase==="over")return;          // 二重決着を防ぐ
  clearTimers(); G.phase="over"; setIP("idle"); render();
  const scores=G.players.map(p=>sum(p.hand));
  if(type==="chain"){
    const ch=G.chain,ret=ch.length-1;
    ch.slice(0,-1).forEach((pi,i)=>scores[pi]=50*Math.pow(2,i));
    scores[winner]=-50*Math.pow(2,ret-1);
  } else scores[winner]=BONUS[type];
  let sixteen=false;
  if(G.players[winner].drew16){
    sixteen=true; scores[winner]=-40;
    for(let i=0;i<4;i++)if(i!==winner&&!(type==="chain"&&G.chain.includes(i)))scores[i]*=2;
  }
  for(let i=0;i<4;i++)G.totals[i]+=scores[i];
  G.history.push({round:G.round,winner,type,scores:scores.slice(),sixteen});
  G.dealer=scores.indexOf(Math.max(...scores)); G.lastWinner=winner;
  say(`${G.players[winner].name} が ${TYPEN[type]} で上がり！`,"hi");
  if(winner===0)SFX.win(); else SFX.over();
  later(()=>{G.hideTop=false;render();},420);
  flashSeal(winner===0?"あがり":"終了");
  G.lastResult={winner,type,scores:scores.slice(),sixteen}; G.resultSeen=false;
  later(()=>showRoundSheet(winner,type,scores,sixteen),1250);
}

/* ═══════════ 描画 ═══════════ */

  }

  $("colorLab").innerHTML=dealing?"場":`場 <b>${CN[G.color]}</b> · ${pts(G.top)}点`;

  $("myTotal").textContent=`累計 ${G.totals[0]>0?"+":""}${G.totals[0]}`;
  const hn=dealing?0:me.hand.length, mid=(hn-1)/2;
  const ov=hn>11?-42:hn>9?-36:hn>7?-28:-20;
  const handEl=$("hand");
  handEl.classList.toggle("many",hn>10);
  const wantKey=dealing?"":me.hand.map(c=>c.id).join(",");
  if(handEl.dataset.key!==wantKey){
    const prev=new Set([...handEl.children].map(el=>+el.dataset.id));
    let nth=0;
    handEl.dataset.key=wantKey;
    handEl.innerHTML=dealing?"":me.hand.map((c,i)=>{
      const fresh=!prev.has(c.id);
      const st=`--rot:${(i-mid)*Math.min(3.6,26/Math.max(hn,1))}deg;--dy:${Math.abs(i-mid)**2*1.1}px;--ov:${ov}px`
        +(fresh?`;animation-delay:${(nth++)*45}ms`:"");

/* 説明は1文ずつ。クリックで文字送りを飛ばし、もう一度で次の文へ。 */
let typer=null, typing=false, sayNodes=null;
function typeStop(){ if(typer){clearTimeout(typer);typer=null;} typing=false; }
function typeAll(){
  typeStop();
  if(sayNodes)sayNodes.forEach(o=>{o.n.nodeValue=o.t;});
  const c=$("coach"), b=c&&c.querySelector(".caret"); if(b)b.classList.add("on");
}
function fitMsg(){}
function typeInto(el,html,done){
  typeStop();
  el.style.minHeight="";
  el.innerHTML=html;
  el.style.minHeight=el.offsetHeight+"px";
  const nodes=[];
  (function walk(n){ for(const ch of n.childNodes){ if(ch.nodeType===3)nodes.push({n:ch,t:ch.nodeValue}); else walk(ch); } })(el);
  nodes.forEach(o=>{o.n.nodeValue="";});
  sayNodes=nodes; typing=true;
  let i=0,j=0;
  (function step(){
    if(i>=nodes.length){ typing=false; typer=null; done&&done(); return; }
    const o=nodes[i]; j++;
    o.n.nodeValue=o.t.slice(0,j);
    if(j>=o.t.length){ i++; j=0; }
    typer=setTimeout(step,26);
  })();
}
/* 説明の場面：卓を止めて、用意した文を順に送る */
function startSay(beat){
  const list=beat.say?beat.say.map(x=>typeof x==="string"?{t:x}:x):[{t:beat.text}];
  G.sayQ=list; G.sayI=-1;
  holdGame(); SFX.notify();
  advanceSay();
}
function advanceSay(){
  demoClear();
  G.sayI++;
  const q=G.sayQ||[];
  if(G.sayI>=q.length){ typeStop(); hideCoach(); resumeGame(); render(); return; }
  const s=q[G.sayI];
  const c=$("coach");
  c.className="coach stop";
  G.tapSeen=(G.tapSeen||0)+1;
  c.innerHTML='<div class="body"><p></p></div>'+
    '<div class="foot">'+
    '<span class="tapline">この枠を押す、または Enter で次へ</span><span class="caret"></span></div>';
  c.hidden=false;
  c.onclick=onSayClick;
  c.tabIndex=0;c.setAttribute("role","button");c.setAttribute("aria-label","説明を次へ進める");
  c.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();onSayClick();}};
  c.querySelector(".caret").textContent="▼";
  // 先に本文の高さを確定させてから図を描く（描いたあとに枠が伸びると位置がずれるため）
  typeInto(c.querySelector("p"),s.t,()=>{ const b=c.querySelector(".caret"); if(b)b.classList.add("on"); });
  fitMsg();
  G.sayShow=s.show||null;
  redrawDemo();
}
function onSayClick(){ if(typing)typeAll(); else advanceSay(); }
// 図はいまの配置で描き直す（枠の高さが変わったり画面が変わったとき用）
function redrawDemo(){
  demoClear();
  if(G&&G.sayShow){ try{ G.sayShow(tutCtx()); }catch(e){} }
}
/* 操作の案内：ボタンなし。言われたとおりに操作すれば次へ進む */
function coachDo(html){
  const c=$("coach");
  typeStop(); demoClear();
  c.className="coach do";
  c.innerHTML='<div class="body"><p></p></div>';
  c.onclick=null;
  c.onkeydown=null;c.removeAttribute("role");c.removeAttribute("tabindex");c.removeAttribute("aria-label");
  c.hidden=false;
  typeInto(c.querySelector("p"),html);
  fitMsg();
}
function hideCoach(){
  const c=$("coach");
  if(c){ c.hidden=true; c.innerHTML=""; c.onclick=null; }

/* ── 卓の上に描く補助表示 ── */
function demoClear(){ const d=$("demo"); if(d){ d.innerHTML="<svg></svg>"; d.hidden=true; } }
function demoOn(){ const d=$("demo"); d.hidden=false; return d; }
function dRect(el){ return el&&el.getBoundingClientRect?el.getBoundingClientRect():null; }
function chipAt(x,y,text,cls){
  const c=document.createElement("div");
  c.className="dchip "+(cls||""); c.innerHTML=text;
  c.style.left=x+"px"; c.style.top=y+"px";
  demoOn().appendChild(c); return c;
}
// 要素のそばに札を付ける（下寄せ＝カードの上に重ねる）
function demoTag(el,text,cls){
  const r=dRect(el); if(!r)return;
  chipAt(r.left+r.width/2, r.bottom-16, text, cls);
}
// 要素の上に付ける
function demoTagTop(el,text,cls){
  const r=dRect(el); if(!r)return;
  chipAt(r.left+r.width/2, r.top-16, text, cls);
}
// 数字が浮き上がる
function demoFloat(el,text,cls){
  const r=dRect(el); if(!r)return;
  chipAt(r.left+r.width/2, r.top+r.height/2, text, "pt up "+(cls||""));
}
function demoRing(el,pad){
  const r=dRect(el); if(!r)return;
  const q=pad==null?6:pad;
  const d=document.createElement("div");
  d.className="dring";
  d.style.left=(r.left-q)+"px"; d.style.top=(r.top-q)+"px";
  d.style.width=(r.width+q*2)+"px"; d.style.height=(r.height+q*2)+"px";
  demoOn().appendChild(d);
}
// 2つの要素を線で結ぶ
function demoLink(a,b,text){
  const ra=dRect(a), rb=dRect(b); if(!ra||!rb)return;
  const x1=ra.left+ra.width/2, y1=ra.top+ra.height/2;
  const x2=rb.left+rb.width/2, y2=rb.top+rb.height/2;
  const mx=(x1+x2)/2, my=(y1+y2)/2-Math.max(40,Math.abs(x2-x1)*.22);
  const svg=demoOn().querySelector("svg");
  const path=document.createElementNS("http://www.w3.org/2000/svg","path");
  path.setAttribute("d","M"+x1+" "+y1+" Q"+mx+" "+my+" "+x2+" "+y2);
  svg.appendChild(path);
  if(text)chipAt(mx,my+8,text);
}

let arrowTarget=null, arrowRAF=0;
function hideArrow(){
  const a=$("arrow"); if(a)a.hidden=true;
  if(arrowTarget){ arrowTarget.classList.remove("aim"); arrowTarget=null; }
  if(arrowRAF){ cancelAnimationFrame(arrowRAF); arrowRAF=0; }
}
function aimArrow(st,c){
  let el=null;
  if(st&&st.point){ try{ el=st.point(c); }catch(e){ el=null; } }
  if(!el){ hideArrow(); return; }
  if(arrowTarget===el){ if(!arrowRAF)arrowRAF=requestAnimationFrame(trackArrow); return; }
  if(arrowTarget)arrowTarget.classList.remove("aim");
  arrowTarget=el; el.classList.add("aim");
  if(!arrowRAF)arrowRAF=requestAnimationFrame(trackArrow);
}
// 対象は持ち上がるので、矢印は毎フレーム位置を追いかける
function trackArrow(){
  arrowRAF=0;
  const a=$("arrow");
  if(!arrowTarget||!arrowTarget.isConnected){ hideArrow(); return; }
  const r=arrowTarget.getBoundingClientRect();
  if(!r.width&&!r.height){ hideArrow(); return; }
  const fromBelow=arrowTarget.classList.contains("seat")||r.top<90;
  a.classList.toggle("up",fromBelow);
  a.style.left=(r.left+r.width/2)+"px";
  a.style.top=(fromBelow? r.bottom+6 : r.top-(innerWidth<760?37:46))+"px";
  a.hidden=false;
  arrowRAF=requestAnimationFrame(trackArrow);
}
function tutCtx(){
  const me=G.players[0];
  const myTurn=G.phase==="turn"&&G.turn===0;
  const ctls=()=>[...document.querySelectorAll("#ctl .btn")].filter(b=>!b.disabled);
  return {g:G,me,myTurn,legal:myTurn?legalGroups(me):[],
    btn:t=>ctls().some(b=>b.textContent.indexOf(t)===0),
    button:t=>ctls().find(b=>b.textContent.indexOf(t)===0)||null,
    btn2:t=>ctls().some(b=>b.textContent.indexOf(t)>=0),
    button2:t=>ctls().find(b=>b.textContent.indexOf(t)>=0)||null,
    card:n=>document.querySelector('#hand .card[aria-label="'+n+'"]'),
    seat:i=>document.getElementById(i===0?"hand":"seat"+i),
    el:q=>document.querySelector(q),
    playable:()=>document.querySelector('#hand .card:not([disabled])'),
    sel:()=>sel.size};
}
const tutTrue=(fn,c)=>{ try{ return !!fn(c); }catch(e){ return false; } };
function tutStep(){
  if(!G||!G.tutorial||G.hold)return;
  const list=stepsFor(G.round); if(!list)return;
  const c=tutCtx();
  if(G.active!=null){
    const st=list[G.active];
    if(st&&tutTrue(st.when,c)){ aimArrow(st,c); return; }   // 実行待ち：矢印だけ追従
    G.active=null; hideCoach();
  }
  for(let i=0;i<list.length;i++){
    if(G.tips.has(G.round+":"+i))continue;
    if(!tutTrue(list[i].when,c))continue;
    for(let j=0;j<=i;j++)G.tips.add(G.round+":"+j);
    if(list[i].stop){ G.active=null; startSay(list[i]);
      if(list[i].point)aimArrow(list[i],c); else hideArrow(); }
    else { G.active=i; coachDo(list[i].text); aimArrow(list[i],c); }
    return;
  }
}
function showLesson(n){

let modalResume=false,previousFocus=null;
function open(html,dismissible){
  if(veil.hidden){previousFocus=document.activeElement;modalResume=!!(G&&G.players&&!G.hold&&G.phase!=="over");if(modalResume)holdGame();}

function close(){veil.hidden=true;document.querySelector(".room").inert=false;if(modalResume){modalResume=false;resumeGame();if(G?.players)render();}if(previousFocus?.isConnected)previousFocus.focus();}
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!veil.hidden&&veil.dataset.lock!=="1")close();});
document.addEventListener("keydown",e=>{
  if(e.key!=="Tab"||veil.hidden)return;
  const items=[...sheet.querySelectorAll("button:not(:disabled),select,input,a[href],summary")].filter(x=>x.getClientRects().length);
  if(!items.length){e.preventDefault();return;}
  const first=items[0],last=items.at(-1);
  if(e.shiftKey&&(document.activeElement===first||document.activeElement===sheet)){e.preventDefault();last.focus();}
  else if(!e.shiftKey&&(document.activeElement===last||document.activeElement===sheet)){e.preventDefault();first.focus();}
});

function showRules(fromStart=false){
  open(`<div class="kicker">RULE BOOK</div><h2>ONU の要点</h2>
  <h3>UNO との違いだけ先に</h3>
  <ul><li><b>点が少ないほうが勝ち。</b>オヌ上がり・オヌスペは−20点、重ね上がり・割り込み上がりは0点。上がれなかった人は手札に残った点が失点。</li>
  <li><b>同じ数字は何枚でも同時に出せる</b>（重ねだし）。ただし<b>上がりの札に記号カードは使えない</b>。</li>
  <li><b>自分の番でなくても出せる場面がある。</b>カードが出た直後の数秒間（受付時間）に、割り込み・オヌスペを狙える。</li>
  <li><b>Draw2 / Wild Draw4 の重ね返しが正式ルール。</b>返せなかった人がまとめて引く。</li>
  <li><b>上がり方に役があり、役で点が決まる。</b>下の表のとおり。</li></ul>
  <h3>カードの点数</h3>
  <ul><li>数字カード … その数字（0〜9）</li><li>Skip / Reverse / Draw2 … 各10点</li>
  <li>Wild / Wild Draw4 … 各20点</li></ul>
  <h3>出し方</h3>
  <ul><li>場のカードと同じ色・同じ数字・同じ文字なら出せる。</li>
  <li><b>重ねだし</b>：同じ数字（または同じ文字）のカードは何枚でも同時に出せる。</li>
  <li><b>割り込み</b>：色も数字（文字）も場と同じカードは、順番に関係なく出せる。次はその人の次の人から。</li>
  <li>Reverse は奇数枚で逆回り、偶数枚でそのまま。Skip は 2×枚数 人先へ。</li>
  <li>Draw2 / Wild Draw4 は重ねて返せる。返せなかった人が（枚数×2）／（枚数×4）枚引く。<b>引いている間は誰もカードを出せない</b>（ルールブックの「アウトオブプレイ」）。</li></ul>
  <p>引いた後は、引いた札を含めて手札から出せます。出さない場合は「なし」。次の人が札を出すまで、割り込み・オヌスペの受付は閉じたままです。Draw2にはDraw2、Wild Draw4にはWild Draw4だけを重ねて返せます。</p>
  <h3>上がり方と得点</h3>
  <ul><li><b>オヌ上がり</b> −20点 … 残り1枚で「オヌ！」と宣言し、最後の1枚を出して上がる。</li>
  <li><b>オヌスペ</b> −20点 … 場のカードの点数と手札（2枚以上）の合計が等しいとき、順番に関係なく全部出して上がる。自分が出したカードには不可。</li>
  <li><b>オヌスペ返し／破り</b> … 返した人 −50点、返された人 +50点。連続すると倍々（+50 → +100 → +200、最後に上がった人は −50×2の(回数−1)乗）。</li>
  <li><b>重ね上がり</b> 0点 … 同じ数字のカード2枚以上を出して上がる。</li>
  <li><b>割り込み上がり</b> 0点 … オヌ状態で、場と同色同数字のカードを割り込んで上がる。</li>
  <li><b>16枚返し</b> … 一度に16枚引いた人がそのラウンドで上がると、その人 −40点、他の人は手札合計の2倍。</li></ul>
  <h3>返し・破りを、例で覚える</h3><p><b>返し：</b>Aが「赤2＋青4」でオヌスペし、青4をいちばん上に置いた。Bが「黄1＋緑3」を持っていれば、合計4なのでオヌスペ返し！<br><b>破り：</b>Aの次の順番の人がオヌ状態で、青の数字札か、色を問わず4を持っていれば、その1枚でオヌスペ破り！</p><p>どちらにも続けて返し・破りができます。A → B → C → Dと続くと、得点は順に <b>+50、+100、+200、−200</b>。出す札は全て数字札である必要があります。</p>
  <h3>ラウンド終了</h3>
  <p>誰かが上がった時点で終了。他の人は手札の点数がそのまま加算されます。決めたラウンド数を終えて、合計点が一番低い人が勝者。</p>
  <h3>一人用にした部分</h3>
  <ul><li>札が出た直後に、次の通常手番を待つ<b>優先受付</b>を設けています。ゆっくり6秒、スタンダード3秒、チャレンジ2.2秒。通常手番になっても、誰かが引き始めるまでは割り込み・オヌスペを使えます。説明や一時停止の間はCPUも止まります。</li>
  <li>残り1枚になる手では「オヌ！と言って出す」も選べます。通常の「出す」の後は、その札の優先受付中に「オヌ！」を押せます。言い忘れの指摘は本人の次の手番まで可能（引いている間を除く）。指摘されれば4枚、指摘されず順番が戻れば1枚引きます。</li>
  <li>CPUはオヌスペを常に見抜くわけではありません。あなたが先に気づけば、その場は取れます。</li></ul>
  <details class="rule-note"><summary>ルールブックの解釈と、一人用で補った部分</summary><p>Wild Draw4の累積について、本文の「×2」と16枚返しの「4枚で16枚」が矛盾するため、本ゲームは<b>×4</b>を採用しています。原文の誤記と断定するものではありません。</p><p>通常ドローは1手番1枚。デッキは108枚（各色0が1枚、1〜9と文字札が各2枚、WildとWild Draw4が各4枚）。これらの詳細は提示された本文にないため、本ゲームの設定です。同点は同率順位とします。</p><p>16枚返しと返し・破りが同時に成立した場合、勝者は−40点、返し・破りで確定した相手の加点は維持し、それ以外の手札点だけを2倍とします。この優先関係は本文に明記がないため、本ゲームの取り決めです。</p></details>
  <div class="rowbtns"><button class="btn" id="rc">閉じる</button></div>`);
  if(fromStart){veil.dataset.lock="1";veil.onclick=null;}
  sheet.querySelector("#rc").onclick=fromStart?showStart:close;
}
